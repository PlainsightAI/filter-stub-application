server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Webvis SSE events
    location = /events {
        proxy_pass http://webvis:8000/main/data;

        proxy_http_version 1.1;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }
    # Webvis SSE events
    location = /cam1 {
        proxy_pass http://webvis:8000/;

        proxy_http_version 1.1;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }
}
